# Enables pg_stat_statements for perf_tool's exact per-query breakdown
# (see PERF_TOOL.md). Needs shared_preload_libraries — a postmaster-context
# setting, so this only takes effect after a full postgres restart, not
# just a reload. Safe to remove this file (and restart) to turn it back off.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000
