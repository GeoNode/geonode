x-common-django:
  &default-common-django
  image: geonode/geonode:latest-ubuntu-26.04
  build:
      context: ./
      dockerfile: Dockerfile
  restart: unless-stopped
  user: "${GEONODE_UID_GID:-0}"
  env_file:
    - ${COMPOSE_ENV_FILES:-.env}
  volumes:
    - '.:/usr/src/geonode'
    - statics:/mnt/volumes/statics
  depends_on:
    permissions-init:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # One-shot root container fixing the volumes ownership for the non-root services
  permissions-init:
    image: geonode/geonode:latest-ubuntu-26.04
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: permissions4${COMPOSE_PROJECT_NAME}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "/usr/src/geonode/docker/permissions/fix-permissions.sh"]
    # only the variables of the script, not the whole env file
    environment:
      - PERMISSIONS_INIT_SKIP=${PERMISSIONS_INIT_SKIP:-}
      - PERMISSIONS_INIT_FORCE=${PERMISSIONS_INIT_FORCE:-false}
    volumes:
      - statics:/volumes/statics
      - geoserver-data-dir:/volumes/geoserver-data-dir
      - backup-restore:/volumes/backup-restore
      - nginx-confd:/volumes/nginx-confd
      - nginx-certificates:/volumes/nginx-certificates
      - dbdata:/volumes/dbdata
      - dbbackups:/volumes/dbbackups

  # Our custom django application. It includes Geonode.
  django:
    << : *default-common-django
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: django4${COMPOSE_PROJECT_NAME}
    # only django runs backup and restore, which need the GeoServer data directory
    volumes:
      - '.:/usr/src/geonode'
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://django:8000/"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/geonode/uwsgi.ini"

  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    container_name: celery4${COMPOSE_PROJECT_NAME}
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "celery-cmd"
    healthcheck:
      test: "celery -b ${BROKER_URL} inspect ping"
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 2

  # Nginx is serving django static and media files and proxies to django and geonode
  nginx:
    image: geonode/nginx:rootless
    container_name: nginx4${COMPOSE_PROJECT_NAME}
    user: "${NGINX_UID_GID:-0}"
    env_file:
      - ${COMPOSE_ENV_FILES:-.env}
    environment:
      - RESOLVER=127.0.0.11
    ports:
      # the non-root Nginx image listens on 8080/8443, see NGINX_HTTP_LISTEN_PORT in .env.sample
      - "${HTTP_PORT}:${NGINX_HTTP_LISTEN_PORT:-80}"
      - "${HTTPS_PORT}:${NGINX_HTTPS_LISTEN_PORT:-443}"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics:ro
    restart: unless-stopped
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    healthcheck:
      test: "if ps -o pid | grep -w 1 > /dev/null; then echo 'nginx running'; else exit 1;fi"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: geonode/letsencrypt:2.6.0-latest
    container_name: letsencrypt4${COMPOSE_PROJECT_NAME}
    env_file:
      - ${COMPOSE_ENV_FILES:-.env}
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  # Geoserver backend
  geoserver:
    image: geonode/geoserver:rootless-test
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    user: "${GEOSERVER_UID_GID:-0}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://geoserver:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ${COMPOSE_ENV_FILES:-.env}
    ports:
      - "8080:8080"
    volumes:
      # GeoServer serves the uploaded rasters from statics, it never writes there
      - statics:/mnt/volumes/statics:ro
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
    restart: unless-stopped
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      django:
        condition: service_healthy


  # PostGIS database.
  db:
    # use geonode official postgis 15 image
    image: geonode/postgis:15-3.5-latest
    entrypoint: ["/usr/local/bin/geonode-postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    container_name: db4${COMPOSE_PROJECT_NAME}
    user: "${DB_UID_GID:-0}"
    env_file:
      - ${COMPOSE_ENV_FILES:-.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
      - ./docker/postgresql/docker-entrypoint-wrapper.sh:/usr/local/bin/geonode-postgres-entrypoint.sh:ro
      - ./docker/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgresql/conf.d:/etc/postgresql/conf.d:ro
    restart: unless-stopped
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      # uncomment to enable remote connections to postgres
      #ports:
      #  - "5432:5432"

  # Vanilla Redis service. This is needed by celery
  redis:
    image: redis:8-alpine
    container_name: redis4${COMPOSE_PROJECT_NAME}
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  redisdata:
    name: ${COMPOSE_PROJECT_NAME}-redisdata
